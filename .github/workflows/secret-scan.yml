# Secret scan: fail the pull request if it adds a secret.
#
# This is the second line of defense. The first is GitHub push protection
# (Settings -> Code security -> Secret scanning -> Push protection), which
# rejects a push containing a recognized key before it reaches GitHub at all.
#
# If this check goes red, deleting the file in a new commit is NOT enough:
# the secret is still in git history. Rotate the key (make a new one, revoke
# the old one), then fix the branch.
#
# Only the commits in the pull request are scanned. Keys in this repository's
# history from before October 2026 are retired (see README "Secrets").

name: Secret scan

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so the PR's commits can be compared with its base

      # Rule 1: no environment files at all, whatever is in them.
      - name: Block .env files
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          found=$(git diff --name-only --diff-filter=AMR "$BASE_SHA...$HEAD_SHA" \
            | grep -E '(^|/)\.env(\..+)?$' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$found" ]; then
            echo "::error::This pull request adds or changes environment files. Remove them and use .env.example or dotnet user-secrets instead:"
            echo "$found"
            exit 1
          fi
          echo "No .env files in this pull request."

      # Rule 2: no secrets in any file (API keys, tokens, connection strings, private keys).
      # TruffleHog recognizes hundreds of key formats and, where it can, checks whether a key is live.
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown
