@if ($any(bcService.breadcrumbs$ | async); as breadcrumbs) {
  @if (breadcrumbs[breadcrumbs.length-1].label !== 'Home') {
    <section class="ws-page-band">
      <div class="ws-container">
        <h1>{{breadcrumbs[breadcrumbs.length-1].label | titlecase}}</h1>
        <xng-breadcrumb>
          <ng-container *xngBreadcrumbItem="let breadcrumb">
            {{breadcrumb | titlecase}}
          </ng-container>
        </xng-breadcrumb>
      </div>
    </section>
  }
}
