@if (product) {
  <article class="ws-product-card">
    <a class="ws-product-photo" routerLink="/shop/{{product.id}}" tabindex="-1" aria-hidden="true">
      <img [src]="product.pictureUrl" alt="">
    </a>
    <div class="ws-product-body">
      <div class="ws-product-meta">{{product.productBrand}} · {{product.productType}}</div>
      <h3><a routerLink="/shop/{{product.id}}">{{product.name}}</a></h3>
      <div class="ws-price">{{product.price | currency}}</div>
      <div class="ws-product-actions">
        <button type="button" class="btn btn-primary" (click)="addItemToBasket()">Add to basket</button>
        <a routerLink="/shop/{{product.id}}" class="btn btn-outline-primary">Details</a>
      </div>
    </div>
  </article>
}
