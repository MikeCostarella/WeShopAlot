<div class="ws-container">
  @if (product) {
    <div class="row">
      <div class="col-6">
        <img src="{{product.pictureUrl}}" alt="{{product.name}}" class="w-100 rounded-3 border">
      </div>
      <div class="col-6 mt-5">
        <div class="ws-caps text-secondary">{{product.productBrand}} · {{product.productType}}</div>
        <h2 class="display-6">{{product.name}}</h2>
        <p class="ws-price fs-2">{{product.price | currency}}</p>
        @if (quantityInBasket > 0) {
          <h5 class="text-primary mb-3">
            You have {{quantityInBasket}} of this item in your basket
          </h5>
        }
        <div class="d-flex justify-content-start align-items-center">
          <i
            (click)="decrementQuantity()"
            class="fa fa-minus-circle text-primary me-2"
          style="cursor: pointer; font-size: 2em;"></i>
          <span class="font-weight-bold" style="font-size: 1.5em;">
            {{quantity}}
          </span>
          <i
            (click)="incrementQuantity()"
            class="fa fa-plus-circle text-primary ms-2"
          style="cursor: pointer; font-size: 2em;"></i>
          <button
            class="btn btn-primary ms-4"
            (click)="updateBasket()"
            [disabled]="quantity === quantityInBasket"
          >{{buttonText}}</button>
        </div>
        <div class="row mt-4">
          <h3 class="h4">Description</h3>
          <p>{{product.description}}</p>
        </div>
      </div>
    </div>
  }

</div>
